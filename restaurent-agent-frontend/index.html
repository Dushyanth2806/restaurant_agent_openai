<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Agent</title>
</head>
<body>
  <header>
    <h1>🍽️ Restaurant Agent <span id="health" class="dot" title="Checking…"></span></h1>
    <div class="settings">
      <input id="apiUrl" title="Backend base URL">
      <label><input type="checkbox" id="demo"> Demo mode</label>
      <label><input type="checkbox" id="showJson"> Raw JSON</label>
    </div>
  </header>

  <main id="chat"></main>

  <div class="chips" id="chips">
    <button>Find Indian restaurants</button>
    <button>Details for Spice Palace</button>
    <button>Is Taj Flavors available on 2024-11-16 for 4 people?</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask about restaurants, details or reservations…" autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
